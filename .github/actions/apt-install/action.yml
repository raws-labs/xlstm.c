name: apt-install
description: >
  Install packages, tolerating a stalled Ubuntu mirror. The failure this exists
  for: apt has no default fetch timeout, so a mirror that accepts a connection
  and then stops responding blocks the job until its ceiling. Observed here as
  fourteen minutes of silence mid-fetch on four jobs at once.

inputs:
  packages:
    description: Space-separated package list
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -u
        # Bound every fetch. This alone turns an indefinite hang into a prompt
        # failure; the mirror rotation below is what then recovers from it.
        opts="-o Acquire::Retries=3
              -o Acquire::http::Timeout=20
              -o Acquire::https::Timeout=20
              -o Acquire::ftp::Timeout=20"

        # The runner's regional mirror first, since it is normally fastest, then
        # the canonical archive, then a second regional one.
        for mirror in \
            http://azure.archive.ubuntu.com/ubuntu \
            http://archive.ubuntu.com/ubuntu \
            http://us.archive.ubuntu.com/ubuntu ; do
          sudo sed -i -E \
            "s#https?://[a-z0-9.]*archive\.ubuntu\.com/ubuntu#$mirror#g" \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true

          if sudo apt-get $opts update \
             && sudo apt-get $opts install -y --no-install-recommends ${{ inputs.packages }} ; then
            echo "installed via $mirror"
            exit 0
          fi
          echo "::warning::$mirror did not serve the packages, trying the next"
        done

        echo "::error::no Ubuntu mirror served the packages"
        exit 1
