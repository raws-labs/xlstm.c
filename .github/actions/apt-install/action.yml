name: apt-install
description: >
  Install packages without depending on an Ubuntu mirror being fast or even
  responsive. Two failures seen here: a mirror that accepts a connection and
  then goes silent, which blocks apt indefinitely because it has no default
  fetch timeout; and a mirror that answers at 217 kB/s, where a 57 MB package
  outlives the job. The first needs a bound and a retry, the second needs the
  download not to happen at all.

inputs:
  packages:
    description: Space-separated package list
    required: true

runs:
  using: composite
  steps:
    # Downloads land in a user-owned directory so this needs no root to cache,
    # and apt reuses whatever is already there. Keyed on the exact package list,
    # so a changed list misses rather than installing a stale set.
    - name: Restore the package cache
      uses: actions/cache@v4
      with:
        path: ~/.aptcache
        key: apt-${{ runner.os }}-${{ hashFiles('.github/actions/apt-install/action.yml') }}-${{ inputs.packages }}

    - shell: bash
      run: |
        set -u
        mkdir -p ~/.aptcache/partial

        # Bound every fetch. Without this a silent mirror blocks until the job
        # ceiling; with it, a stall becomes a prompt failure the loop can act on.
        opts="-o Acquire::Retries=3
              -o Acquire::http::Timeout=20
              -o Acquire::https::Timeout=20
              -o Acquire::ftp::Timeout=20
              -o Dir::Cache::archives=$HOME/.aptcache"

        for mirror in \
            http://azure.archive.ubuntu.com/ubuntu \
            http://archive.ubuntu.com/ubuntu \
            http://us.archive.ubuntu.com/ubuntu ; do
          sudo sed -i -E \
            "s#https?://[a-z0-9.]*archive\.ubuntu\.com/ubuntu#$mirror#g" \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true

          if sudo apt-get $opts update \
             && sudo apt-get $opts install -y --no-install-recommends ${{ inputs.packages }} ; then
            echo "installed via $mirror"
            # Leave only the .debs behind; partial/ and lock files are not cache.
            sudo chown -R "$(id -u):$(id -g)" ~/.aptcache || true
            rm -rf ~/.aptcache/partial ~/.aptcache/lock 2>/dev/null || true
            exit 0
          fi
          echo "::warning::$mirror did not serve the packages, trying the next"
        done

        echo "::error::no Ubuntu mirror served the packages"
        exit 1
