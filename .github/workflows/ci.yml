name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only to pull the toolchain image. Nothing in this workflow writes anything.
permissions:
  contents: read
  packages: read

# Every job that needs a cross toolchain or an emulator runs inside the image
# .github/workflows/toolchain-image.yml publishes, and installs nothing.
# Acquisition, not testing, was what this workflow spent its time on: apt was
# about 90% of every cross job, and against a throttled Ubuntu mirror one job
# spent 34 minutes installing a compiler for a 3-second test. The image tag is
# the content hash of .github/toolchain.Dockerfile, so this pins an exact image
# rather than floating onto whatever was pushed last; the refs job fails if
# the pin and the Dockerfile have drifted apart.
#
# refs and build-and-test stay on a plain runner deliberately. Neither
# installs anything today, so the image could only make them slower - and
# build-and-test's whole point is the host compiler pair, clang included, which
# is the one toolchain here that is meant to be the runner's and not ours.

jobs:
  # Every path and document a tracked file cites must resolve inside the
  # repository, so a clone is self-contained.
  # This job may only call make targets. A step spelled here and nowhere else
  # is a check no contributor can run before pushing, which is how the image
  # pin came to be asserted in this file alone: re-recording the perf baseline
  # moved the tag, every local gate stayed green, and the drift surfaced on a
  # pull request. check-refs now asserts both the pin and this rule about its
  # own job, so the two cannot separate again.
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: make check-refs
      - name: Adoption helpers stay correct
        run: make check-tools

  # Host backends. `make test` auto-detects, which resolves to sse2 on the x86
  # runners; `make test-ref` forces the scalar backend. ref is gated explicitly
  # because it is the baseline every other backend is defined against - if it
  # regresses, the reference vectors themselves are suspect, not the backend.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (auto-detected backend)
        run: make test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Test scalar reference backend
        run: make test-ref
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      # The approximate gate build (XLSTM_GATES=approx, include/xlstm_util.h),
      # on both host backends. The same four golden suites plus the gate-math
      # checks, which is where the approximation's accuracy is actually
      # asserted - the suites quantize to INT8 and would pass whatever it did.
      # Measured at 5 s.
      - name: Test the approximate gate build
        run: make test-approx
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

  # Efficiency is what this library is for, so a speed regression has to be able
  # to fail a build. Wall-clock on a shared runner cannot do that job - it varies
  # far more than the regressions worth catching - so the gate counts retired
  # instructions under callgrind instead, which is exact and repeatable.
  #
  # The counts are specific to the compiler that produced them, so this needs a
  # fixed toolchain, not a fixed runner label. It used to ask for ubuntu-24.04
  # and hope; the image carries gcc and valgrind and refuses to build unless
  # they match the versions test/perf_baseline.txt records, so the thing the
  # baseline depends on is now pinned by content rather than by a label that
  # can move underneath it. make perf still checks at run time and refuses to
  # compare across a mismatch.
  #
  # Host backends only. This says nothing about cortexm or esp performance.
  perf:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xlstm-c-toolchain:a90d9c17c9e7
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instruction-count gate
        run: make perf
        env:
          CC: gcc
          CXX: g++

  # ARM NEON, cross-compiled and executed under emulation. Together with
  # cross-cortexm below these are the only non-x86 backends the suite can
  # execute, so they are the gates that catch ISA-specific defects (loop tails,
  # alignment, accumulator width) before they reach a real target.
  cross-neon:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xlstm-c-toolchain:a90d9c17c9e7
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile and run under qemu-aarch64
        run: make test-neon

  # The cortexm backend's DSP arithmetic, on armv7-a under emulation. Its
  # SXTAB16 and SMLAD are ARMv6 DSP instructions that A-profile also has, so the
  # kernels can be cross-compiled and executed with no board and no bare-metal
  # harness. Without this, cortexm is the one backend with no gate in this
  # repository at all - it is otherwise checked only from a hardware-in-the-loop
  # harness that needs physical parts.
  #
  # Green here does NOT mean the Cortex-M targets are covered. It gates the
  # arithmetic against the same golden vectors as every other backend, plus one
  # thing those cannot see - test/cortexm_gate.cc puts each operand in turn
  # against a guard page, so a group load that stepped past a row faults rather
  # than passing with the right answer. Nothing else: armv7-a Linux permits
  # unaligned word access, so the INT8 matvec's -mno-unaligned-access load path
  # is not compiled and M-profile alignment behaviour is not exercised;
  # XLSTM_FPU_HAS_MINMAX_ROUND resolves to 0 here, so the FPv5 vminnm/vrinta
  # path M7 and M33 declare is not covered; and emulated execution says nothing
  # about cycles. See the make target.
  cross-cortexm:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xlstm-c-toolchain:a90d9c17c9e7
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile and run under qemu-arm
        run: make test-cortexm
      # Cortex-M is the target the approximate gate build exists for, so it is
      # the one cross backend gated in both builds. The other three are not,
      # and that is a considered subset rather than an omission: the gate
      # arithmetic is plain C99 in the shared cell code with no SIMD contract
      # behind it, so a fourth backend would run another instance of the same
      # code rather than another code path. Any of them can be run in either
      # build by hand: make test-esp XLSTM_GATES=approx.
      - name: Cross-compile and run the approximate gate build
        run: make test-cortexm XLSTM_GATES=approx

  # The esp backend on an emulated ESP32-S3. Like cross-cortexm above, this
  # exists because without it the backend has no gate anywhere: its only other
  # check is test/adapters/esp-dl, which compiles and never executes.
  #
  # System emulation rather than qemu-user, because Xtensa has no Linux
  # userspace - that is the only way this differs from the two jobs above. The
  # bare-metal startup, linker script and semihosting stdout all come from specs
  # files inside the toolchain, so there is no IDF project to build, no
  # bootloader, no flash image and no Docker.
  #
  # The toolchain and Espressif's QEMU fork are in the image, both pinned there.
  # The toolchain is the one ESP-IDF v5.4 ships, so the gate compiles the
  # kernels with the compiler a user of that IDF gets; QEMU has to be
  # Espressif's fork because upstream has no esp32s3 machine.
  #
  # Green here does NOT mean the part is covered. QEMU executes the S3's PIE
  # instructions but models no timing, and its Xtensa FPU is not guaranteed
  # bit-identical to silicon. See the Makefile's test-esp target for what the
  # run does and does not assert.
  emulated-esp:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xlstm-c-toolchain:a90d9c17c9e7
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile and run under qemu-system-xtensa
        run: make test-esp

  # The helium backend on an emulated Cortex-M55. Same reason to exist as the
  # two jobs above: without it the backend has no gate anywhere, and MVE is not
  # an ISA any runner here can execute natively.
  #
  # System emulation, like emulated-esp - M-profile has no Linux userspace
  # either. gcc-arm-none-eabi supplies the compiler and the MVE intrinsics,
  # qemu-system-arm supplies the board. MPS3 AN547 is the machine because its
  # CPU is a Cortex-M55; none of the MPS2 machines model an Armv8.1-M part.
  #
  # Green here does NOT mean the part is covered. QEMU executes MVE
  # architecturally - with CP10/CP11 left at reset the first vector instruction
  # faults instead, which is what proves the instructions are really run - but
  # it models no timing and its FPU is not guaranteed bit-identical to silicon.
  # See the Makefile's test-helium target for what the run does and does not
  # assert.
  emulated-helium:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xlstm-c-toolchain:a90d9c17c9e7
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile and run under qemu-system-arm
        run: make test-helium

  # The mutation battery, host backends only. Every other job here proves the
  # suite passes; this one proves it can still fail. It injects each known
  # defect in turn, rebuilds, and requires the assertion recorded for that
  # defect to fire - which is the only check on whether the INT8 bounds still
  # bound anything. A widened tolerance fails by making a gate quietly stop
  # failing, and nothing else in this workflow can see that.
  #
  # ref and sse2, not all six. Those two carry every entry that exercises a
  # tolerance, a bound or a state comparison, which is what needs a gate on
  # every change. The cross entries (neon, cortexm, esp, helium) exercise the
  # fast-path counters instead, and the four jobs above already run those
  # gates unmutated on each of those backends. Host-only is about 1 minute
  # where all six are about 8.
  #
  # It edits files in the working tree, which is why `make mutants` is not part
  # of `make test`. A CI checkout is discarded either way, and the battery
  # restores every file on exit, on failure and on interrupt.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Mutation battery
        run: make mutants MUTANT_BACKENDS="ref sse2"
