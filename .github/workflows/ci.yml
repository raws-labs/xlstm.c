name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # This repository is public. Tracked files must not cite paths that exist only
  # on a maintainer's machine - they leak internal structure and are broken
  # references in a clone.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: make check-internal-refs
      - name: Head-slicing example stays correct
        run: python3 test/head_slicing_example.py
      - name: Adoption helpers stay correct
        run: make check-tools

  # Host backends. `make test` auto-detects, which resolves to sse2 on the x86
  # runners; `make test-ref` forces the scalar backend. ref is gated explicitly
  # because it is the baseline every other backend is defined against - if it
  # regresses, the reference vectors themselves are suspect, not the backend.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (auto-detected backend)
        run: make test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Test scalar reference backend
        run: make test-ref
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

  # Efficiency is what this library is for, so a speed regression has to be able
  # to fail a build. Wall-clock on a shared runner cannot do that job - it varies
  # far more than the regressions worth catching - so the gate counts retired
  # instructions under callgrind instead, which is exact and repeatable.
  #
  # Pinned to ubuntu-24.04 rather than ubuntu-latest on purpose: the counts are
  # specific to the compiler that produced them, and `ubuntu-latest` silently
  # moving to a new image would change gcc under the baseline. make perf checks
  # the toolchain against the one recorded in test/perf_baseline.txt and refuses
  # to compare across a mismatch, so an image bump fails loudly and is fixed by
  # re-recording, rather than quietly measuring the compiler instead of the code.
  #
  # Host backends only. This says nothing about cortexm or esp performance.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        uses: ./.github/actions/apt-install
        with:
          packages: valgrind
      - name: Instruction-count gate
        run: make perf
        env:
          CC: gcc
          CXX: g++

  # ARM NEON, cross-compiled and executed under emulation. Together with
  # cross-cortexm below these are the only non-x86 backends the suite can
  # execute, so they are the gates that catch ISA-specific defects (loop tails,
  # alignment, accumulator width) before they reach a real target.
  cross-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross toolchain and emulator
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
      - name: Cross-compile and run under qemu-aarch64
        run: make test-neon

  # The cortexm backend's DSP arithmetic, on armv7-a under emulation. Its
  # SXTAB16 and SMLAD are ARMv6 DSP instructions that A-profile also has, so the
  # kernels can be cross-compiled and executed with no board and no bare-metal
  # harness. Without this, cortexm is the one backend with no gate in this
  # repository at all - it is otherwise checked only from a hardware-in-the-loop
  # harness that needs physical parts.
  #
  # Green here does NOT mean the Cortex-M targets are covered. It gates the
  # arithmetic against the same golden vectors as every other backend, plus one
  # thing those cannot see - test/cortexm_gate.cc puts each operand in turn
  # against a guard page, so a group load that stepped past a row faults rather
  # than passing with the right answer. Nothing else: armv7-a Linux permits
  # unaligned word access, so the INT8 matvec's -mno-unaligned-access load path
  # is not compiled and M-profile alignment behaviour is not exercised;
  # XLSTM_FPU_HAS_MINMAX_ROUND resolves to 0 here, so the FPv5 vminnm/vrinta
  # path M7 and M33 declare is not covered; and emulated execution says nothing
  # about cycles. See the make target.
  cross-cortexm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install armhf cross toolchain and emulator
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user
      - name: Cross-compile and run under qemu-arm
        run: make test-cortexm

  # The esp backend on an emulated ESP32-S3. Like cross-cortexm above, this
  # exists because without it the backend has no gate anywhere: its only other
  # check is test/adapters/esp-dl, which compiles and never executes.
  #
  # System emulation rather than qemu-user, because Xtensa has no Linux
  # userspace - that is the only way this differs from the two jobs above. Two
  # tarballs, ~190 MB together, replace the ESP-IDF container this used to
  # need: the bare-metal startup, linker script and semihosting stdout all come
  # from specs files inside the toolchain, so there is no IDF project to build,
  # no bootloader, no flash image and no Docker.
  #
  # Both versions are pinned. The toolchain is the one ESP-IDF v5.4 ships, so
  # the gate compiles the kernels with the compiler a user of that IDF gets.
  # QEMU has to be Espressif's fork: upstream has no esp32s3 machine.
  #
  # Green here does NOT mean the part is covered. QEMU executes the S3's PIE
  # instructions but models no timing, and its Xtensa FPU is not guaranteed
  # bit-identical to silicon. See the Makefile's test-esp target for what the
  # run does and does not assert.
  emulated-esp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TOOLCHAIN: https://github.com/espressif/crosstool-NG/releases/download/esp-14.2.0_20241119/xtensa-esp-elf-14.2.0_20241119-x86_64-linux-gnu.tar.xz
      QEMU: https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
    steps:
      - uses: actions/checkout@v4
      # 180 MB of release tarballs, pinned by URL, so the key can be the URLs
      # themselves: a cache hit is correct by construction and a version bump
      # misses rather than serving a stale toolchain.
      - name: Cache the toolchain and emulator
        id: esp-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/xtensa-esp-elf
            ${{ runner.temp }}/qemu
          key: esp-${{ hashFiles('.github/workflows/ci.yml') }}-${{ env.TOOLCHAIN }}-${{ env.QEMU }}
      # The three libraries are qemu-system-xtensa's DT_NEEDED entries. SDL2 is
      # one of them even though this runs -display none: it is linked, not
      # dlopened, so the binary will not start without it.
      - name: Install qemu-system-xtensa's shared libraries
        uses: ./.github/actions/apt-install
        with:
          packages: libpixman-1-0 libsdl2-2.0-0 libslirp0
      - name: Fetch the pinned toolchain and emulator
        run: |
          if [ ! -d "$RUNNER_TEMP/xtensa-esp-elf" ]; then
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 "$TOOLCHAIN" | tar -xJ -C "$RUNNER_TEMP"
          fi
          if [ ! -d "$RUNNER_TEMP/qemu" ]; then
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 "$QEMU" | tar -xJ -C "$RUNNER_TEMP"
          fi
          echo "$RUNNER_TEMP/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/qemu/bin" >> "$GITHUB_PATH"
      - name: Cross-compile and run under qemu-system-xtensa
        run: make test-esp

  # The helium backend on an emulated Cortex-M55. Same reason to exist as the
  # two jobs above: without it the backend has no gate anywhere, and MVE is not
  # an ISA any runner here can execute natively.
  #
  # System emulation, like emulated-esp - M-profile has no Linux userspace
  # either. Unlike emulated-esp, both halves are distribution packages, so
  # there is no tarball to fetch and no version to pin: gcc-arm-none-eabi
  # supplies the compiler and the MVE intrinsics, qemu-system-arm supplies the
  # board. MPS3 AN547 is the machine because its CPU is a Cortex-M55; none of
  # the MPS2 machines model an Armv8.1-M part.
  #
  # Green here does NOT mean the part is covered. QEMU executes MVE
  # architecturally - with CP10/CP11 left at reset the first vector instruction
  # faults instead, which is what proves the instructions are really run - but
  # it models no timing and its FPU is not guaranteed bit-identical to silicon.
  # See the Makefile's test-helium target for what the run does and does not
  # assert.
  emulated-helium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install the Arm bare-metal toolchain and qemu-system-arm
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm
      - name: Cross-compile and run under qemu-system-arm
        run: make test-helium
