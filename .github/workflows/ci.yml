name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Host backends. `make test` auto-detects, which resolves to sse2 on the x86
  # runners; `make test-ref` forces the scalar backend. ref is gated explicitly
  # because it is the baseline every other backend is defined against - if it
  # regresses, the reference vectors themselves are suspect, not the backend.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (auto-detected backend)
        run: make test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Test scalar reference backend
        run: make test-ref
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

  # ARM NEON, cross-compiled and executed under emulation. This is the only
  # non-x86 backend the suite can execute, so it is the one gate that catches
  # ISA-specific defects (loop tails, alignment, accumulator width) before they
  # reach a real target.
  cross-neon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
      - name: Cross-compile and run under qemu-aarch64
        run: make test-neon

  # Cortex-M HIL harness, EMULATED ONLY (qemu-system-arm inside Docker, via
  # test/hil/cortexm/Dockerfile). Runs the four golden-data suites, fused
  # via test/hil_runner.cc, on three emulated cores: M4 (mps2-an386), M7
  # (mps2-an500), M33 (mps2-an505). All three link src/xlstm_simd_ref.c -
  # there is no src/xlstm_simd_cortexm.c yet (see CLAUDE.md work items
  # 1-2). `docker run`'s own exit code is the combined verdict across all
  # three cores (test/hil/cortexm/qemu_gate.sh), so this job fails on a
  # hang, crash, or missing sentinel from any one of them, never a silent
  # pass. This does NOT run on real hardware - that is a separate,
  # deliberately manual-only path (see hil-esp32s3 in the root Makefile
  # for the same policy applied to the existing ESP32-S3 target) and is
  # never wired into CI.
  cortexm-hil-emulated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the Cortex-M QEMU HIL gate (M4 + M7 + M33, emulated)
        run: make hil-cortexm-qemu
