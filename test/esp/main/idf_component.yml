# esp-dsp supplies the dsps_dotprod_f32 that src/xlstm_simd_esp.c is the
# whole point of gating. Pinned to the same 1.5.2 that
# test/adapters/esp-dl/Dockerfile clones, so both esp32s3 builds in this
# repository exercise one esp-dsp release. A bare "1.5.2" is an exact match
# under the component manager's version syntax, not a caret range.
dependencies:
  idf: ">=5.4"
  espressif/esp-dsp: "1.5.2"
