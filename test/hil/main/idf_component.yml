# esp-dsp provides dsps_dotprod_f32_ae32, used by src/xlstm_simd_esp.c (the
# `esp` SIMD backend under test).
#
# Pinned to 1.5.2 - the exact version test/adapters/esp-dl/Dockerfile pins
# by `git clone --branch v1.5.2`, so both esp32s3 build paths in this repo
# exercise the same esp-dsp release. "1.5.2" (no range operator) resolves to
# an exact match (==1.5.2) under the IDF Component Manager's version syntax,
# not a caret range.
dependencies:
  idf: ">=5.4"
  espressif/esp-dsp: "1.5.2"
